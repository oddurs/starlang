name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Install LuaJIT
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install luajit
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run integration & differential runtime suite
        run: cargo test
      - name: Run zero-dependency WebAssembly 1.0 compiler & V8 JIT runner
        run: cargo run --quiet -- wasm > /dev/null
      - name: Run polyglot time-travel debugger & backward causal slicer
        run: cargo run --quiet -- debug > /dev/null
      - name: Run asymptotic Big-O, gas profiler & 13-spoke density analyzer
        run: cargo run --quiet -- complexity > /dev/null
      - name: Run polyglot QuickCheck, invariant discovery & counterexample shrinker
        run: cargo run --quiet -- quickcheck > /dev/null
      - name: Run CEGIS automated program repair & fault localization
        run: cargo run --quiet -- repair > /dev/null
      - name: Run PBE observational-equivalence inductive program synthesizer
        run: cargo run --quiet -- synth > /dev/null
      - name: Run control-flow graph (CFG), dominator tree & natural-loop analyzer
        run: cargo run --quiet -- cfg > /dev/null
      - name: Run Cytron SSA, dominance frontier, phi-node & liveness analyzer
        run: cargo run --quiet -- ssa > /dev/null
      - name: Run Hoare-Logic DbC contract synthesizer & Weakest-Precondition verifier
        run: cargo run --quiet -- contracts > /dev/null
      - name: Run whitebox concolic path explorer & test synthesizer
        run: cargo run --quiet -- concolic > /dev/null
      - name: Run Denning lattice taint & constant-time security auditor
        run: cargo run --quiet -- security > /dev/null
      - name: Run Equality Saturation E-Graph superoptimizer
        run: cargo run --quiet -- egraph > /dev/null
      - name: Run Futamura partial evaluator & interprocedural specializer
        run: cargo run --quiet -- peval > /dev/null
      - name: Run Polyhedral loop dependence & 13-spoke SIMD vectorizer
        run: cargo run --quiet -- polyhedral > /dev/null
      - name: Run Floyd-Turing termination prover & IPET WCET timing analyzer
        run: cargo run --quiet -- wcet > /dev/null
      - name: Run Chaitin-Briggs register allocator & AArch64/x86_64 assembly codegen
        run: cargo run --quiet -- regalloc > /dev/null
      - name: Run interprocedural escape analysis & SROA/RVO lifetime optimizer
        run: cargo run --quiet -- escape > /dev/null
      - name: Run 3-way cross-language semantic AST merger check
        run: cargo run --quiet -- merge > /dev/null
      - name: Run Hub symbolic safety & dead-branch verifier
        run: cargo run --quiet -- verify > /dev/null
      - name: Run Hub AST mutation testing & auto-test hardening
        run: cargo run --quiet -- mutate --harden > /dev/null
      - name: Run property-based lens fuzzer
        run: cargo run --quiet -- fuzz 60
